# Packaged, signed mlch.app (M7 in docs/PLAN-2.md). Build: npm run dist
appId: app.mlch.mac
productName: mlch
copyright: © 2026 move38 B.V.
directories:
  output: dist
  buildResources: build
  # Assembled by scripts/package-app.mjs: Next's standalone server and the traced Electron side.
  app: build/app
npmRebuild: false
# Next's server reads its own files and child processes need real paths: no asar. Few files now, so signing is quick.
asar: false
files:
  - "**/*"
# build/app/node_modules (and Turbopack's links in .next/node_modules) are copied by build/after-pack.cjs:
# electron-builder would otherwise rebuild node_modules from package.json dependencies, which the staged app has none of.
extraResources:
  - from: native/mlch-audio/.build/release/mlch-audio
    to: mlch-audio
  - from: native/mlch-audio/.build/release/FluidAudio_FluidAudio.bundle
    to: FluidAudio_FluidAudio.bundle
protocols:
  - name: mlch
    schemes: [mlch]
mac:
  category: public.app-category.productivity
  icon: electron/icon.png
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  minimumSystemVersion: "14.4"
  hardenedRuntime: true
  # The audio helper's data files (lexicons, model configs) are not code; the bundle is signed as a whole.
  signIgnore:
    - "FluidAudio_FluidAudio\\.bundle/Contents/Resources/"
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  identity: "move38 B.V. (FP3X7G6BU7)"
  # Set APPLE_KEYCHAIN_PROFILE=mlch (xcrun notarytool store-credentials mlch) to notarize.
  notarize: false
  extendInfo:
    # Placeholder wording (George): shown in macOS's permission prompts.
    NSMicrophoneUsageDescription: Speech to text.
    NSAudioCaptureUsageDescription: Speech to text in calls.
    LSUIElement: false
publish:
  provider: generic
  url: https://mlch.app/releases/mac
afterPack: build/after-pack.cjs
dmg:
  # lzfse: smaller and faster to open than the default zlib.
  format: ULFO
